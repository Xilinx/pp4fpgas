# NOTE1: The default for files is the section name so
# if the section is [foo.cpp] then default values are:
# files = foo.cpp
# tb_files = foo-top.cpp
#
# You can override defaults in specific sections, by:
#
# [foo.cpp]
# files = foo.cpp bar.cpp
# period = 3.5

[DEFAULTS]
part = xcvh1522-vsva3697-3HP-e-S
period = 2
config_csim_prefix = config_csim -sanitize_address=true -sanitize_undefined=true


[block_mm.cpp]
top = blockmatmul
tb_files = block_mm-top.cpp
#config_compile = config_compile -pipeline_loops 0 ; set_directive_expression_balance -off blockmatmul ; config_unroll -tripcount_threshold 0

[complex_fir.cpp]
top = complexFIR
files = fir.c \
        complex_fir.cpp
tb_files = complex_fir-top.cpp

[cordic.cpp]
top = cordic
files = cordic.cpp
tb_files = cordic-top.cpp

[cordic_fixed.cpp]
