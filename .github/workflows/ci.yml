name: CI/CD

on:
  # Allows the book build to be run on demand from the Actions tab.
  workflow_dispatch:
  push:
    branches:
      - '*'       # matches every branch
      - '*/*'     # matches every branch containing a single '/'
      - '!master' # excludes master
  pull_request:
  # Run daily at 0:01 UTC
  schedule:
  - cron:  '1 0 * * *'

jobs:
  test:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4
    - name: Compile book
      # Official Texlive image, pinned to the 2024 release. The previous
      # xucheng/texlive-full image is deprecated (last pushed 2020) and
      # Alpine-based; this one is Debian-based and already provides make.
      uses: docker://texlive/texlive:TL2024-historic
      with:
        entrypoint: /bin/sh
        args: -c "make all"
    - name: List directory contents
      run: ls -lhtra
