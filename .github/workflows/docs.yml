name: Deploy build

on:
  # Allows the deploy to be run on demand from the Actions tab.
  workflow_dispatch:
  push:
    branches:
    # The release branch for the current tool version. Update this when a new
    # release branch is cut (e.g. 2026.2).
    - 2026.1
    tags:
    - v*

# Publishes via the GitHub Pages "GitHub Actions" source: the site is uploaded as
# an artifact and deployed by actions/deploy-pages, so nothing is pushed to a
# gh-pages branch. pages/id-token are what deploy-pages requires.
permissions:
  contents: read
  pages: write
  id-token: write

# Serialise deploys; don't cancel a run that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Checkout book
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'
    - name: Compile book
      # Official Texlive image, pinned to the 2024 release. The previous
      # xucheng/texlive-full image is deprecated (last pushed 2020) and
      # Alpine-based; this one is Debian-based and already provides make.
      uses: docker://texlive/texlive:TL2024-historic
      with:
        entrypoint: /bin/sh
        args: -c "make all"
    - name: List directory contents
      run: ls -lhtra
    - name: Setup build for deployment
      run: |
        mkdir -p docs/_build
        # main.pdf is the LaTeX build artifact; publish it under the book's name.
        cp main.pdf docs/_build/pp4fpgas.pdf
        # The site publishes a single PDF, so give the root URL a page that
        # redirects to it -- otherwise https://<org>.github.io/pp4fpgas/ is a 404.
        cat > docs/_build/index.html <<'HTML'
        <!DOCTYPE html>
        <html lang="en">
        <head>
        <meta charset="utf-8">
        <title>Parallel Programming for FPGAs</title>
        <meta http-equiv="refresh" content="0; url=pp4fpgas.pdf">
        </head>
        <body>
        <p><a href="pp4fpgas.pdf">Parallel Programming for FPGAs (PDF)</a></p>
        </body>
        </html>
        HTML
    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: docs/_build
    - name: Deploy build to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
