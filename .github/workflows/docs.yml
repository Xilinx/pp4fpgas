name: Deploy build

on:
  # Allows the deploy to be run on demand from the Actions tab.
  workflow_dispatch:
  push:
    branches:
    # The release branch for the current tool version. Update this when a new
    # release branch is cut (e.g. 2026.2).
    - 2026.1
    tags:
    - v*

# peaceiris/actions-gh-pages pushes the built book to the gh-pages branch, so the
# job's GITHUB_TOKEN needs write access to repository contents. Granting it here
# avoids depending on the repo-wide "Workflow permissions" setting.
permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout book
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'
    - name: Compile book
      # Official Texlive image, pinned to the 2024 release. The previous
      # xucheng/texlive-full image is deprecated (last pushed 2020) and
      # Alpine-based; this one is Debian-based and already provides make.
      uses: docker://texlive/texlive:TL2024-historic
      with:
        entrypoint: /bin/sh
        args: -c "make all"
    - name: List directory contents
      run: ls -lhtra
    - name: Setup build for deployment
      run: |
        mkdir -p docs/_build
        # main.pdf is the LaTeX build artifact; publish it under the book's name.
        cp main.pdf docs/_build/pp4fpgas.pdf
    - name: Deploy build to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: docs/_build
        force_orphan: true
        user_name: 'github-actions[bot]'
        user_email: 'github-actions[bot]@users.noreply.github.com'
